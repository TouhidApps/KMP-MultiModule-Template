[versions]
agp = "9.0.1"
android-compileSdk = "36"
android-minSdk = "30"
android-targetSdk = "36"
androidx-activity = "1.12.4"
androidx-appcompat = "1.7.1"
androidx-core = "1.17.0"
androidx-lifecycle = "2.10.0-alpha08"
composeMultiplatform = "1.10.1"
composeHotReload = "1.0.0"
junit = "4.13.2"
kotlin = "2.3.10"
multiplatformSettingsNoArg = "1.3.0"
runner = "1.7.0"
core = "1.7.0"
junitVersion = "1.3.0"

kotlinxDatetime = "0.7.1"
ktor = "3.4.1"

coilNetworkKtor3 = "3.4.0"

coroutines = "1.10.2"
koin = "4.2.0-RC1"
material3Android = "1.4.0"

