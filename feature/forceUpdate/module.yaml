product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

# Ported from the old app's feature/forceUpdate (MVI + a Navigation3 entry).
# NOTE: in the old app this screen has no real update-check logic yet —
# ForceUpdateScreen(contract) renders nothing; the actual UI
# (ForceUpdateScreen(appName, slogan, onUpdateClick)) is dead code, never
# called. Ported as-is; wire a real version-check service later if needed.
dependencies:
  - //core/common
  - //core/ui
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.lifecycle.viewmodel.nav3
  - $libs.androidx.nav3.ui
  - $libs.androidx.material3.adaptive
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: com.touhidapps.kmp.feature.forceupdate.resources
      exposedAccessors: true
  kotlin:
    freeCompilerArgs: [ -Xskip-prerelease-check ]
