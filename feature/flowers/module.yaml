product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

# Ported from the old app's feature/flowers: a full data/domain/presentation
# stack (remote list + details) wired through core/network's ResultNet.
dependencies:
  - //core/common
  - //core/ui
  - //core/network
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.lifecycle.viewmodel.nav3
  - $libs.androidx.nav3.ui
  - $libs.androidx.material3.adaptive
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  - $libs.kotlinx.serialization.json
  - $libs.coil.compose
  - $libs.coil.network.ktor3

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: com.touhidapps.kmp.feature.flowers.resources
      exposedAccessors: true
  kotlin:
    serialization:
      enabled: true
    # FlowerListViewModel exposes its StateFlow/SharedFlow through explicit
    # backing fields so *Contract sees only the read-only type.
    freeCompilerArgs: [ -XXLanguage:+ExplicitBackingFields, -Xskip-prerelease-check ]
