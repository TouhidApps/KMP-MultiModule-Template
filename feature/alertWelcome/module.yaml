product:
  type: kmp/lib
  # Same platform list as core/ui so app/shared (which targets wasmJs)
  # can depend on this feature. See rule 5 in the README.
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

# One-shot welcome dialog. 'Already seen' is persisted in core/preferences.

dependencies:
  - //core/common
  - //core/ui
  - //core/preferences
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.kotlinx.coroutines.core
  - $libs.koin.core

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      # Must be unique across every module that enables Compose resources.
      packageName: com.touhidapps.kmp.feature.alertwelcome.resources
      exposedAccessors: true
