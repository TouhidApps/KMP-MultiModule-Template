product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

# Ported from the old app's feature/about (MVI + a Navigation3 entry for
# both the About screen and its "next" detail pages: license, disclosure,
# tools, contact).
dependencies:
  - //core/common
  - //core/ui
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $libs.compose.iconExtended
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.lifecycle.viewmodel.nav3
  - $libs.androidx.nav3.ui
  - $libs.androidx.material3.adaptive
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: com.touhidapps.kmp.feature.about.resources
      exposedAccessors: true
  kotlin:
    # AboutViewModel exposes its StateFlow through an explicit backing
    # field so AboutContract sees only the read-only type.
    freeCompilerArgs: [ -XXLanguage:+ExplicitBackingFields, -Xskip-prerelease-check ]
