product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - //core/common
  - //core/network
  - //core/preferences
  - //core/ui
  - //feature/about
  - //feature/alertMaintenance
  - //feature/alertWelcome
  - //feature/flowers
  - //feature/forceUpdate
  - //feature/home
  - //feature/language
  - //feature/more
  - //feature/notification
  - //feature/settings
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  - $libs.androidx.nav3.ui
  - $libs.ktor.client.core

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: com.touhidapps.kmp.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
